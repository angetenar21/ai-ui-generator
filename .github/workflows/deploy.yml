name: CI/CD Pipeline

# ─── TRIGGER ──────────────────────────────────────────────────────────────────
# Runs on every push to main branch, and on pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─── JOBS ─────────────────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Lint & Test ────────────────────────────────────────────────────
  # Runs on every push AND every pull request.
  # If this fails, the deploy job is skipped automatically.
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build frontend (verify it compiles)
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000

  # ── JOB 2: Deploy to GCP ─────────────────────────────────────────────────
  # Only runs on pushes to main (not on pull requests).
  # Only runs if the CI job above passed.
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: ci                           # Wait for lint & test to pass first
    if: github.ref == 'refs/heads/main' # Only deploy on main branch pushes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Write the SSH private key from GitHub Secrets to a temp file
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_SSH_HOST }} >> ~/.ssh/known_hosts

      # SSH into your GCP VM and run the deployment commands
      - name: Deploy to GCP VM
        run: |
          ssh ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }} << 'EOF'
            set -e  # Exit immediately if any command fails

            echo "=== Pulling latest code ==="
            cd /var/www/ai-ui-generator/ai-ui-generator
            git config --global --add safe.directory /var/www/ai-ui-generator/ai-ui-generator
            git pull origin main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Building frontend ==="
            VITE_API_BASE_URL="" npm run build

            echo "=== Restarting backend ==="
            # If you use pm2:
            pm2 restart ai-ui-backend || pm2 start backend/server.js --name ai-ui-backend
            pm2 save

            echo "=== Deployment complete! ==="
          EOF
